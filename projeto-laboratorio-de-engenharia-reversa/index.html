<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Live - Developer Edition</title>
    <!-- Bibliotecas via CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        .editor-font { font-family: 'Fira Code', monospace; }
        .prose-dark { color: #e2e8f0; }
        .prose-dark h1, .prose-dark h2, .prose-dark h3 { color: #f8fafc; font-weight: 700; margin-top: 1.5em; margin-bottom: 0.5em; }
        .prose-dark h1 { font-size: 2.25rem; border-bottom: 1px solid #334155; padding-bottom: 0.3em; }
        .prose-dark h2 { font-size: 1.875rem; border-bottom: 1px solid #334155; }
        .prose-dark p { margin-bottom: 1em; line-height: 1.7; }
        .prose-dark a { color: #38bdf8; text-decoration: underline; }
        .prose-dark code { background: #1e293b; padding: 0.2rem 0.4rem; border-radius: 4px; font-family: 'Fira Code', monospace; font-size: 0.9em; }
        .prose-dark pre { background: #0f172a; padding: 1rem; border-radius: 8px; overflow-x: auto; margin: 1em 0; }
        .prose-dark ul { list-style-type: disc; padding-left: 1.5em; margin-bottom: 1em; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 overflow-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const App = () => {
            const [markdown, setMarkdown] = useState("# Bem-vindo ao Markdown Live\n\nComece a escrever seu código aqui...\n\n- Suporte a GFM\n- Preview em tempo real\n- Exportação rápida");
            const [stats, setStats] = useState({ words: 0, chars: 0 });
            const textareaRef = useRef(null);

            // Atualiza estatísticas (palavras e caracteres)
            useEffect(() => {
                const words = markdown.trim() ? markdown.trim().split(/\s+/).length : 0;
                const chars = markdown.length;
                setStats({ words, chars });
            }, [markdown]);

            // Renderiza o Markdown para HTML usando marked.js
            const renderHTML = () => {
                return { __html: marked.parse(markdown, { breaks: true, gfm: true }) };
            };

            // Função para manipular inserção de texto (Toolbar)
            const insertText = (before, after = "") => {
                const textarea = textareaRef.current;
                const start = textarea.selectionStart;
                const end = textarea.selectionEnd;
                const selectedText = markdown.substring(start, end);
                const newText = markdown.substring(0, start) + before + selectedText + after + markdown.substring(end);
                
                setMarkdown(newText);
                
                // Devolve o foco e ajusta seleção
                setTimeout(() => {
                    textarea.focus();
                    textarea.setSelectionRange(start + before.length, end + before.length);
                }, 0);
            };

            const downloadFile = () => {
                const element = document.createElement("a");
                const file = new Blob([markdown], {type: 'text/markdown'});
                element.href = URL.createObjectURL(file);
                element.download = "documento.md";
                document.body.appendChild(element);
                element.click();
            };

            const copyHTML = () => {
                const htmlContent = marked.parse(markdown);
                navigator.clipboard.writeText(htmlContent);
                alert("HTML copiado para a área de transferência!");
            };

            const ToolbarButton = ({ onClick, title, children }) => (
                <button 
                    onClick={onClick}
                    title={title}
                    class="p-2 hover:bg-slate-800 rounded transition-colors text-slate-400 hover:text-white"
                >
                    {children}
                </button>
            );

            return (
                <div class="flex flex-col h-screen">
                    {/* Header / Toolbar */}
                    <header class="h-14 border-b border-slate-800 bg-slate-900 flex items-center justify-between px-4 shrink-0">
                        <div class="flex items-center gap-2">
                            <div class="bg-blue-600 p-1.5 rounded-lg">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.375 2.625a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4Z"/></svg>
                            </div>
                            <h1 class="font-bold text-slate-100 hidden md:block">Markdown <span class="text-blue-500">Live</span></h1>
                        </div>

                        <div class="flex items-center gap-1">
                            <ToolbarButton onClick={() => insertText("**", "**")} title="Negrito">
                                <span class="font-bold">B</span>
                            </ToolbarButton>
                            <ToolbarButton onClick={() => insertText("_", "_")} title="Itálico">
                                <span class="italic text-lg">i</span>
                            </ToolbarButton>
                            <ToolbarButton onClick={() => insertText("# ")} title="Título 1">H1</ToolbarButton>
                            <ToolbarButton onClick={() => insertText("## ")} title="Título 2">H2</ToolbarButton>
                            <ToolbarButton onClick={() => insertText("[", "](https://)")} title="Link">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                            </ToolbarButton>
                            
                            <div class="w-px h-6 bg-slate-700 mx-2"></div>
                            
                            <button onClick={copyHTML} class="flex items-center gap-2 px-3 py-1.5 text-sm bg-slate-800 hover:bg-slate-700 rounded-md transition-all border border-slate-700">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                                Copy HTML
                            </button>
                            
                            <button onClick={downloadFile} class="flex items-center gap-2 px-3 py-1.5 text-sm bg-blue-600 hover:bg-blue-500 text-white rounded-md transition-all shadow-lg shadow-blue-900/20">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
                                Download .md
                            </button>
                        </div>
                    </header>

                    {/* Main Workspace */}
                    <main class="flex flex-1 overflow-hidden">
                        {/* Editor Side */}
                        <div class="flex-1 flex flex-col border-r border-slate-800">
                            <div class="text-[10px] uppercase tracking-widest text-slate-500 px-4 py-2 bg-slate-900/50">Markdown Editor</div>
                            <textarea
                                ref={textareaRef}
                                value={markdown}
                                onChange={(e) => setMarkdown(e.target.value)}
                                class="flex-1 w-full p-6 bg-slate-950 text-slate-300 editor-font focus:outline-none resize-none leading-relaxed"
                                spellCheck="false"
                            />
                        </div>

                        {/* Preview Side */}
                        <div class="flex-1 flex flex-col bg-slate-900/20">
                            <div class="text-[10px] uppercase tracking-widest text-slate-500 px-4 py-2 bg-slate-900/50">Live Preview</div>
                            <div 
                                class="flex-1 overflow-y-auto p-8 prose-dark"
                                dangerouslySetInnerHTML={renderHTML()}
                            />
                        </div>
                    </main>

                    {/* Footer Stats */}
                    <footer class="h-8 bg-slate-900 border-t border-slate-800 px-4 flex items-center justify-end gap-6 text-[11px] text-slate-500 font-medium">
                        <span>PALAVRAS: {stats.words}</span>
                        <span>CARACTERES: {stats.chars}</span>
                        <span class="text-blue-500">UTF-8</span>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
